[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irrigation-footprint"
version = "0.1.0"
description = "Groundwater irrigation footprint in the Tule and Tulare Lake subbasins from NISAR GUNW"
requires-python = ">=3.11"
# Runtime dependencies are managed by environment.yml (conda-forge); install with: pip install -e pipeline --no-deps

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
