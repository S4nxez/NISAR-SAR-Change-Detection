# Reproducible environment of the irrigation footprint pipeline and its tests.
# Works with micromamba, mamba or conda (conda-forge only: GDAL, rasterio and MintPy are unreliable from pip on Windows).
#   micromamba create -f pipeline/environment.yml && micromamba activate irrigation-footprint
#   pip install --no-deps nisar-pytools==0.5.0 && pip install -e pipeline --no-deps
# nisar-pytools comes from PyPI without its dependencies (all listed below): it requires snaphu, which has no Windows
# build, but only imports it inside its own unwrapping function. GUNW is already unwrapped (see ADR-001).
name: irrigation-footprint
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # InSAR time series (prep_nisar.py reader for GUNW)
  - mintpy>=1.6.2
  # Arrays, rasters and HDF5
  - numpy
  - scipy
  - dask
  - xarray>=2024.10
  - zarr
  - h5py>=3.10
  - netcdf4
  - rasterio>=1.3
  - rioxarray>=0.15
  # Vector data and grids
  - geopandas
  - shapely>=2.0
  - pyproj>=3.4
  - h3-py>=4
  # Search and download (NASA Earthdata / ASF)
  - asf_search>=7.0
  - earthaccess
  - requests
  - pyyaml
  # Tests and quality
  - pytest
  - ruff
