# Local development environment (Windows + Docker Desktop). Driven by tools/dev/dev.ps1
# through the root Makefile: there is no need to run it by hand.
#
#   mysql  -> always. Publishes 127.0.0.1:${DB_PORT:-3306} with root/root and the NisarSar database,
#             which are exactly the defaults in server/src/main/resources/application.properties,
#             so the server started from IntelliJ connects without any configuration.
#   server -> "server" profile: only if the machine has no JDK 21 (SERVER_MODE=docker).
#   front  -> "front" profile: hot-reloading live-server when VS Code Go Live is not used
#             (FRONT_MODE=docker).
#
# Paths are relative to this file.
name: nisarsar-dev

services:
  mysql:
    image: docker.io/library/mysql:8
    container_name: nisarsar-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: NisarSar
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  server:
    profiles: ["server"]
    image: docker.io/library/maven:3.9-eclipse-temurin-21
    container_name: nisarsar-dev-server
    working_dir: /app
    command: ["mvn", "-B", "-ntp", "-DskipTests", "spring-boot:run"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/NisarSar
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - ../../server:/app
      # the container's own target/: does not clobber the one IntelliJ builds on Windows
      - server_target:/app/target
      - maven_repo:/root/.m2

  front:
    profiles: ["front"]
    image: docker.io/library/node:20-alpine
    container_name: nisarsar-dev-front
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        npx --yes live-server@1.2.2 --host=0.0.0.0 --port=5500 --no-browser --wait=150
        --proxy=/api:$${API_TARGET}
    environment:
      # Target of /api: the 'server' container if the server runs in Docker, otherwise the host
      # (IntelliJ / make with a local JDK). dev.ps1 sets it and recreates this container when it changes.
      API_TARGET: ${API_TARGET:-http://host.docker.internal:8080/api}
      # Changes made on Windows do not reach the container as events: poll instead
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${FRONT_PORT:-5500}:5500"
    volumes:
      - ../../frontend:/app:ro
      - npm_cache:/root/.npm

volumes:
  mysql_data:
  server_target:
  maven_repo:
  npm_cache:
