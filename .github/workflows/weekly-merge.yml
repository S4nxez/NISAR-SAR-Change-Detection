name: Weekly merge develop -> main

on:
  schedule:
    # Wednesdays 21:00 UTC (GitHub may start scheduled runs a few minutes late)
    - cron: '0 21 * * 3'
  workflow_dispatch:

concurrency:
  group: weekly-merge
  cancel-in-progress: false

# main is protected: changes need a pull request with 1 approval and a linear history.
# The PR is opened and merged with RELEASE_TOKEN (a PAT of the repo owner) and approved by
# github-actions[bot] with GITHUB_TOKEN, as a PR author can't approve their own PR.
# The merge is pushed with a PAT, so the push event fires Build Images (validate + build), Deploy and Sync main into develop.
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Open release pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Compare the trees: after a sync develop always has a merge commit that main lacks, with no changes
          if git diff --quiet origin/main origin/develop; then
            echo "develop has nothing new for main"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reuse the PR of a previous run that didn't merge (e.g. conflicts fixed by hand since)
          number="$(gh pr list --base main --head develop --state open --json number -q '.[0].number')"
          if [ -z "$number" ]; then
            url="$(gh pr create --base main --head develop \
              --title "chore(release): weekly merge develop into main" \
              --body "Automatic weekly release of \`develop\` into \`main\` (weekly-merge.yml).")"
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Approve pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "${{ steps.pr.outputs.number }}" --approve --body "Automatic weekly release approval"

      # Squash: main requires a linear history and develop has merge commits
      - name: Merge pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ! gh pr merge "${{ steps.pr.outputs.number }}" --squash \
            --subject "chore(release): weekly merge develop into main (#${{ steps.pr.outputs.number }})"; then
            echo "::error::Could not merge PR #${{ steps.pr.outputs.number }}. If it conflicts, main has changes that were" \
              "not merged back into develop: merge main into develop (merge commit, not squash) and the next run reuses the PR."
            exit 1
          fi

      # main is merged back into develop by sync-main.yml, which runs on every push to main (this merge included)
