name: Build Images

on:
  push:
    branches: [ main ]

jobs:
  # Pre-deployment validation stage: images are only built and pushed (and Deploy
  # only runs) if every project builds, the tests pass and the whole stack starts
  # and answers. See tools/ci/README.md.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Every docker compose call runs the production compose file plus the CI
      # override (images built from this commit) as an isolated project
      COMPOSE_FILE: podman-compose.yml:tools/ci/compose.ci.yml
      COMPOSE_PROJECT_NAME: nisarsar-ci

    steps:
      - uses: actions/checkout@v4

      - name: Frontend - check JavaScript syntax
        run: |
          node --version
          failed=0
          # Native ES modules served as-is: a syntax error breaks the whole app
          for file in $(git ls-files 'frontend/*.js'); do
            if ! node --check --input-type=module < "$file"; then
              echo "::error file=$file::JavaScript syntax error in $file, see the log above"
              failed=1
            fi
          done
          exit "$failed"

      # Deploy runs tools/ci/rollback.sh from the deployed commit when a deployment fails
      - name: Rollback - test rollback.sh
        run: tools/ci/test-rollback.sh

      - name: Model lab - unit tests
        # Random shutdown of models (fractal_model_lab/tests/prune_tests.c): only the
        # calculation sources, no ncurses. The compile step below reuses their objects.
        run: |
          out="$RUNNER_TEMP/fractal_model_lab"
          make -C fractal_model_lab OBJ_DIR="$out/obj" NAME="$out/fractal_lab" unit

      - name: Model lab - compile
        run: |
          dpkg -s libncurses-dev >/dev/null 2>&1 \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq libncurses-dev; }
          # Build from sources into a scratch dir: the repo tracks prebuilt obj/ files
          out="$RUNNER_TEMP/fractal_model_lab"
          make -C fractal_model_lab -j"$(nproc)" OBJ_DIR="$out/obj" NAME="$out/fractal_lab"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Backend - compile, run tests and package
        working-directory: server
        run: mvn -B -ntp verify

      - name: Startup check - prepare environment
        run: |
          # Throwaway credentials for the CI database. Compose reads .env for the
          # ${...} values of podman-compose.yml (the backend connects as MYSQL_USER
          # with the root password); server/.env is the env_file it requires.
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_USER=root\n' "$password" > .env
          : > server/.env
          docker compose version
          docker compose config --quiet

      - name: Startup check - build images
        run: docker compose build

      - name: Startup check - start stack
        id: stack
        run: docker compose up -d --no-build

      - name: Startup check - smoke test
        run: tools/ci/smoke-test.sh http://127.0.0.1:8089

      - name: Startup check - container status and logs
        if: (failure() || cancelled()) && steps.stack.conclusion != 'skipped'
        run: |
          docker compose ps -a
          # Innermost exception of the backend's first start: usually the root cause of a
          # startup failure, restarts may fail on its consequences (e.g. a failed migration).
          # sed drops the ANSI codes compose may add to log lines.
          cause="$(docker compose logs --no-color --no-log-prefix backend | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' \
            | awk '/Starting .*Application/ && ++starts > 1 { exit } /Caused by:/ { cause = $0 } END { print cause }')"
          if [ -n "$cause" ]; then echo "::error title=Backend error::${cause//%/%25}"; fi
          for service in backend mysql caddy frontend; do
            echo "::group::$service logs"
            docker compose logs --no-color --timestamps "$service"
            echo "::endgroup::"
          done

      - name: Startup check - stop stack
        if: always() && steps.stack.conclusion != 'skipped'
        # Best effort: the runner is discarded anyway, a cleanup error must not block the deployment
        continue-on-error: true
        run: docker compose down -v --remove-orphans

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The revision label tells which commit an image comes from, e.g. the known-good images a rollback
      # restores (tools/ci/rollback.sh status)
      - name: Build backend (multi-arch)
        run: |
          cd server
          mvn clean package -DskipTests
          docker buildx build \
            -f Containerfile \
            --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ghcr.io/s4nxez/nisar-sar-change-detection-back:latest \
            --push .

      - name: Build frontend (multi-arch)
        run: |
          cd frontend
          docker buildx build \
            -f Containerfile \
            --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ghcr.io/s4nxez/nisar-sar-change-detection-front:latest \
            --push .
