version: "3.8"

# Production runs this file with the defaults of NISAR_IMAGE_TAG and NISAR_HTTP_PORT. The develop stack (QA) runs it
# from its own checkout, whose .env sets NISAR_IMAGE_TAG=develop and NISAR_HTTP_PORT=8090, and NISAR_PR_PREVIEWS=true for
# its Caddy to route the PR previews (tools/ci/preview.sh): see tools/ci/README.md
services:
  mysql:
    image: docker.io/library/mysql:8
    restart: always
    env_file:
      - ./server/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: NisarSar
    volumes:
      - mysql_data:/var/lib/mysql
#TODO      - ./data/sql:/docker-entrypoint-initdb.d:Z
    networks:
      - NisarSar-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/s4nxez/nisar-sar-change-detection-back:${NISAR_IMAGE_TAG:-latest}
    # At most 5 retries if Spring/Flyway fails at startup; the counter resets on
    # every deploy (--force-recreate). Avoids endless startup loops.
    restart: on-failure:5
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/NisarSar
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_PROFILES_ACTIVE: spring
    networks:
      - NisarSar-net

  frontend:
    image: ghcr.io/s4nxez/nisar-sar-change-detection-front:${NISAR_IMAGE_TAG:-latest}
    restart: always
    networks:
      - NisarSar-net

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "127.0.0.1:${NISAR_HTTP_PORT:-8089}:80"
    environment:
      # Read by the Caddyfile: /pr-<N>/ goes to the preview of pull request N (develop stack only)
      NISAR_PR_PREVIEWS: ${NISAR_PR_PREVIEWS:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - NisarSar-net

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  NisarSar-net:
    external: false
